<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgQaida" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldQaida" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="10%" stop-color="#047857"/>
      <stop offset="90%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="shadowQaida" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas with Subtle Pattern -->
  <rect width="600" height="360" fill="url(#bgQaida)"/>
  
  <!-- Subtle Islamic Star in Background -->
  <g fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.12">
    <rect x="220" y="100" width="160" height="160" rx="10"/>
    <rect x="220" y="100" width="160" height="160" rx="10" transform="rotate(45 300 180)"/>
    <circle cx="300" cy="180" r="95"/>
  </g>

  <!-- Noorani Qaida Book Object -->
  <g filter="url(#shadowQaida)" transform="translate(160, 30)">
    <!-- Book Outer Cover -->
    <rect x="0" y="0" width="280" height="300" rx="12" fill="url(#bookCover)" stroke="url(#goldQaida)" stroke-width="4"/>
    
    <!-- Spine Line -->
    <line x1="20" y1="0" x2="20" y2="300" stroke="url(#goldQaida)" stroke-width="2" opacity="0.6"/>

    <!-- Inner Golden Border -->
    <rect x="32" y="16" width="232" height="268" rx="8" fill="#fffdfa" stroke="url(#goldQaida)" stroke-width="2.5"/>
    <rect x="38" y="22" width="220" height="256" rx="6" fill="none" stroke="#047857" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Top Calligraphy / Ribbon -->
    <path d="M 80 34 Q 148 24 216 34 L 210 52 Q 148 44 86 52 Z" fill="url(#goldQaida)"/>
    <text x="148" y="46" font-family="'Amiri', serif" font-size="13" font-weight="bold" fill="#064e3b" text-anchor="middle">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ</text>

    <!-- Main Title: القاعدة النورانية -->
    <rect x="52" y="72" width="192" height="58" rx="8" fill="#047857"/>
    <rect x="55" y="75" width="186" height="52" rx="6" fill="none" stroke="url(#goldQaida)" stroke-width="1.5"/>
    <text x="148" y="112" font-family="'Noto Nastaliq Urdu', 'Amiri', serif" font-size="26" font-weight="bold" fill="#fde68a" text-anchor="middle">القَاعِدَة النُّورَانِيَّة</text>
    
    <!-- Subtitle: نورانی قاعدہ -->
    <text x="148" y="150" font-family="'Noto Nastaliq Urdu', serif" font-size="20" font-weight="bold" fill="#b45309" text-anchor="middle">نورانی قاعدہ مع تجوید</text>
    <line x1="80" y1="160" x2="216" y2="160" stroke="url(#goldQaida)" stroke-width="1.5"/>

    <!-- Lesson 1 Alphabet Preview Box (ا ب ت ث) -->
    <g transform="translate(56, 175)">
      <!-- Letters Grid -->
      <rect x="0" y="0" width="42" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
      <text x="21" y="28" font-family="'Amiri', serif" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">ا</text>

      <rect x="47" y="0" width="42" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
      <text x="68" y="28" font-family="'Amiri', serif" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">ب</text>

      <rect x="94" y="0" width="42" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
      <text x="115" y="28" font-family="'Amiri', serif" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">ت</text>

      <rect x="141" y="0" width="42" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
      <text x="162" y="28" font-family="'Amiri', serif" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">ث</text>
    </g>

    <!-- Bottom Badge: بچوں اور ابتدائی طلباء کے لیے -->
    <rect x="65" y="234" width="166" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="148" y="254" font-family="'Noto Sans Arabic', sans-serif" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">★ بنیاد اور درست مخارج ★</text>
  </g>

  <!-- Left/Right Floating Badges -->
  <g transform="translate(30, 260)">
    <rect width="115" height="36" rx="18" fill="#ffffff" opacity="0.95"/>
    <text x="57" y="23" font-family="'Noto Sans Arabic', sans-serif" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">✓ بچوں کے لیے</text>
  </g>
  <g transform="translate(460, 50)">
    <rect width="110" height="36" rx="18" fill="#f59e0b"/>
    <text x="55" y="23" font-family="'Noto Sans Arabic', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3 دن فری ٹرائل</text>
  </g>
</svg>
