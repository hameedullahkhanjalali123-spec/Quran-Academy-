<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNazra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldNazra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="rihalWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#290e02"/>
    </linearGradient>
    <filter id="glowNazra" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgNazra)"/>

  <!-- Halo/Glow behind Quran -->
  <circle cx="300" cy="170" r="130" fill="url(#goldNazra)" opacity="0.15" filter="url(#glowNazra)"/>

  <!-- Wooden Rihal (Quran Stand) -->
  <g transform="translate(160, 180)">
    <!-- Back Leg Left -->
    <path d="M 50 40 L 10 110 L 40 110 L 90 40 Z" fill="url(#rihalWood)"/>
    <!-- Back Leg Right -->
    <path d="M 230 40 L 270 110 L 240 110 L 190 40 Z" fill="url(#rihalWood)"/>
    <!-- Cross Beam Left to Right -->
    <path d="M 20 100 L 140 10 L 160 10 L 260 100 L 230 100 L 140 30 L 50 100 Z" fill="url(#rihalWood)" stroke="url(#goldNazra)" stroke-width="1.5"/>
    <!-- Intricate Carving on Rihal -->
    <circle cx="140" cy="45" r="8" fill="none" stroke="url(#goldNazra)" stroke-width="1.5"/>
    <path d="M 130 65 Q 140 55 150 65" stroke="url(#goldNazra)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Open Holy Quran Mushaf -->
  <g transform="translate(140, 60)">
    <!-- Left Page -->
    <path d="M 160 20 C 110 8 40 12 10 28 C 4 60 8 130 14 148 C 44 134 110 130 160 144 Z" 
          fill="#fffdf8" stroke="url(#goldNazra)" stroke-width="3"/>
    
    <!-- Left Page Inner Decorative Border -->
    <path d="M 152 30 C 112 20 52 24 24 38 C 20 64 22 120 28 134 C 54 124 112 120 152 134 Z" 
          fill="none" stroke="#047857" stroke-width="1.5"/>

    <!-- Left Page Quran Lines & Arabic Surah Header -->
    <rect x="36" y="44" width="105" height="18" rx="4" fill="url(#goldNazra)" opacity="0.85"/>
    <text x="88" y="57" font-family="'Amiri', serif" font-size="10" font-weight="bold" fill="#064e3b" text-anchor="middle">سُورَةُ الفَاتِحَة</text>
    
    <line x1="32" y1="72" x2="144" y2="68" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="84" x2="144" y2="80" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="96" x2="144" y2="92" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="108" x2="144" y2="104" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="120" x2="130" y2="116" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Page -->
    <path d="M 160 20 C 210 8 280 12 310 28 C 316 60 312 130 306 148 C 276 134 210 130 160 144 Z" 
          fill="#fffdf8" stroke="url(#goldNazra)" stroke-width="3"/>
    
    <!-- Right Page Inner Decorative Border -->
    <path d="M 168 30 C 208 20 268 24 296 38 C 300 64 298 120 292 134 C 266 124 208 120 168 134 Z" 
          fill="none" stroke="#047857" stroke-width="1.5"/>

    <!-- Right Page Lines -->
    <rect x="178" y="44" width="105" height="18" rx="4" fill="url(#goldNazra)" opacity="0.85"/>
    <text x="230" y="57" font-family="'Amiri', serif" font-size="10" font-weight="bold" fill="#064e3b" text-anchor="middle">سُورَةُ البَقَرَة</text>

    <line x1="176" y1="72" x2="288" y2="76" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="176" y1="84" x2="288" y2="88" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="176" y1="96" x2="288" y2="100" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="176" y1="108" x2="288" y2="112" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="190" y1="120" x2="286" y2="124" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Center Spine & Silk Ribbon Bookmark -->
    <line x1="160" y1="20" x2="160" y2="148" stroke="#065f46" stroke-width="3"/>
    <path d="M 160 20 L 160 175 L 166 170 L 160 175" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Title Ribbon Banner at Top -->
  <g transform="translate(170, 16)">
    <rect width="260" height="34" rx="17" fill="url(#goldNazra)"/>
    <text x="130" y="23" font-family="'Noto Nastaliq Urdu', 'Amiri', serif" font-size="16" font-weight="bold" fill="#064e3b" text-anchor="middle">قرآن مجید ناظرہ مع ترتیل و روانی</text>
  </g>

  <!-- Bottom Floating Feature Pill -->
  <g transform="translate(200, 312)">
    <rect width="200" height="32" rx="16" fill="#ffffff" opacity="0.95"/>
    <text x="100" y="21" font-family="'Noto Sans Arabic', sans-serif" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">★ تجوید کے ساتھ روانی سے پڑھیں ★</text>
  </g>
</svg>
