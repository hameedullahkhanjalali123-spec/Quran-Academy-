<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDuas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="goldDuas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadowDuas" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgDuas)"/>

  <!-- Subtle Minarets and Crescent Silhouette in Background -->
  <g fill="#f59e0b" opacity="0.12">
    <!-- Minaret Left -->
    <path d="M 70 360 L 70 160 L 80 140 L 90 160 L 90 360 Z"/>
    <circle cx="80" cy="135" r="4"/>
    <!-- Minaret Right -->
    <path d="M 510 360 L 510 160 L 520 140 L 530 160 L 530 360 Z"/>
    <circle cx="520" cy="135" r="4"/>
    <!-- Crescent Moon at Top Right -->
    <path d="M 450 60 A 25 25 0 1 1 480 30 A 20 20 0 1 0 450 60 Z"/>
  </g>

  <!-- Central Card Object -->
  <g filter="url(#shadowDuas)" transform="translate(150, 40)">
    <rect x="0" y="0" width="300" height="270" rx="14" fill="#ffffff" stroke="url(#goldDuas)" stroke-width="3"/>
    <rect x="10" y="10" width="280" height="250" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1" stroke-dasharray="6,3"/>

    <!-- Title Ribbon -->
    <path d="M 40 24 L 260 24 L 245 56 L 55 56 Z" fill="#047857"/>
    <text x="150" y="47" font-family="'Amiri', 'Noto Nastaliq Urdu', serif" font-size="20" font-weight="bold" fill="#fef3c7" text-anchor="middle">الأَدْعِيَةُ اليَوْمِيَّةُ المَسْنُونَة</text>

    <!-- Subtitle: روزمرہ کی دعائیں -->
    <text x="150" y="82" font-family="'Noto Nastaliq Urdu', serif" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">روزمرہ کی دعائیں اور مسنون اعمال</text>

    <!-- Raised Hands for Dua Illustration -->
    <g transform="translate(115, 100)" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round">
      <!-- Left Hand -->
      <path d="M 25 60 C 20 40, 15 20, 22 10 C 26 5, 32 8, 33 22 C 34 8, 40 7, 43 20 C 44 9, 50 10, 52 24 C 54 16, 58 16, 60 28 C 58 45, 52 55, 45 65 Z" fill="#ecfdf5"/>
      <!-- Right Hand -->
      <path d="M 45 65 C 38 55, 32 45, 30 28 C 32 16, 36 16, 38 24 C 40 10, 46 9, 47 20 C 50 7, 56 8, 57 22 C 58 8, 64 5, 68 10 C 75 20, 70 40, 65 60 Z" fill="#ecfdf5" transform="translate(10, 0) scale(-1, 1) translate(-80, 0)"/>
    </g>

    <!-- Key Topics Checklist -->
    <g transform="translate(30, 182)">
      <!-- Item 1: صبح و شام کے اذکار -->
      <rect x="0" y="0" width="115" height="32" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="57" y="21" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">✓ صبح و شام اذکار</text>

      <!-- Item 2: نماز کا مکمل طریقہ -->
      <rect x="125" y="0" width="115" height="32" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="182" y="21" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">✓ نماز کی درستی</text>

      <!-- Item 3: اسلامی آداب و اخلاق -->
      <rect x="0" y="38" width="115" height="32" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
      <text x="57" y="59" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">✓ مسنون آداب</text>

      <!-- Item 4: با محاورہ ترجمہ -->
      <rect x="125" y="38" width="115" height="32" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
      <text x="182" y="59" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">✓ با ترجمہ دعائیں</text>
    </g>
  </g>

  <!-- Floating Star Badge -->
  <g transform="translate(430, 270)">
    <rect width="135" height="34" rx="17" fill="#f59e0b"/>
    <text x="67" y="22" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">★ سیرت و تربیت ★</text>
  </g>
</svg>
