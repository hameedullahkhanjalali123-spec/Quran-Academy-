<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="30%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <linearGradient id="navyText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1D37" />
      <stop offset="100%" stop-color="#030A14" />
    </linearGradient>

    <filter id="shadowLuxe2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0A1D37" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- EMBLEM: Sculpted Monogram 'Q' + Crescent + Quran -->
  <g transform="translate(30, 15)" filter="url(#shadowLuxe2)">
    <!-- Base Shield: Smooth Rounded Diamond / Octagon -->
    <rect x="15" y="15" width="160" height="160" rx="36" fill="#0A1D37" stroke="url(#gold2)" stroke-width="2.5"/>
    <rect x="20" y="20" width="150" height="150" rx="32" fill="#030A14"/>
    <rect x="26" y="26" width="138" height="138" rx="28" fill="none" stroke="url(#gold2)" stroke-width="1" stroke-dasharray="6 3" opacity="0.6"/>

    <!-- Sculpted 'Q' formed by Golden Crescent Moon & Flourishing Tail -->
    <path d="M 95 36 A 48 48 0 1 0 138 126 L 158 148 L 138 144 A 48 48 0 0 0 95 36 Z" fill="url(#gold2)"/>
    <circle cx="95" cy="88" r="32" fill="#030A14"/>

    <!-- Inner Emerald Radiant Moon -->
    <path d="M 95 56 A 32 32 0 1 0 120 108 A 26 26 0 1 1 95 56 Z" fill="url(#emeraldTeal)"/>

    <!-- Radiant 8-Point Star at Top -->
    <g transform="translate(120, 48) scale(0.9)">
      <polygon points="12,0 15,8 24,12 15,16 12,24 9,16 0,12 9,8" fill="url(#gold2)"/>
    </g>

    <!-- Open Holy Quran with Gold Inlay -->
    <g transform="translate(95, 110)">
      <!-- Left Page -->
      <path d="M 0 0 Q -18 -12 -36 -8 L -36 18 Q -18 14 0 24 Z" fill="#FFFFFF"/>
      <path d="M -3 3 Q -18 -7 -33 -4 L -33 15 Q -18 12 -3 21 Z" fill="#F0FDF4"/>
      <line x1="-8" y1="5" x2="-28" y2="2" stroke="url(#gold2)" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-8" y1="10" x2="-28" y2="7" stroke="url(#gold2)" stroke-width="1.8" stroke-linecap="round"/>
      
      <!-- Right Page -->
      <path d="M 0 0 Q 18 -12 36 -8 L 36 18 Q 18 14 0 24 Z" fill="#FFFFFF"/>
      <path d="M 3 3 Q 18 -7 33 -4 L 33 15 Q 18 12 3 21 Z" fill="#F0FDF4"/>
      <line x1="8" y1="5" x2="28" y2="2" stroke="url(#gold2)" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="8" y1="10" x2="28" y2="7" stroke="url(#gold2)" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Center Spine -->
      <line x1="0" y1="-2" x2="0" y2="28" stroke="url(#gold2)" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(245, 20)">
    <!-- Quranic Ayah Subtitle -->
    <text x="3" y="42" font-family="'Traditional Arabic', 'Amiri', serif" font-size="25" font-weight="bold" fill="#0F766E">
      بِسْمِ اللَّهِ الرَّحْمٰنِ الرَّحِيمِ • رَبِّ زِدْنِي عِلْمًا
    </text>

    <!-- Main Brand Name: Q ISLAMIC -->
    <text x="0" y="108" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-size="62" font-weight="900" fill="url(#navyText)" letter-spacing="2">
      Q ISLAMIC
    </text>

    <!-- ACADEMY in Al-Furqan Inspired Vibrant Contrast with Gold Shadow -->
    <text x="2" y="158" font-family="'Montserrat', 'Poppins', sans-serif" font-size="46" font-weight="900" fill="#E11D48" letter-spacing="6">
      ACADEMY
    </text>

    <!-- Tagline & Phone Bar -->
    <g transform="translate(3, 176)">
      <rect x="0" y="0" width="4" height="16" fill="url(#gold2)"/>
      <text x="14" y="13" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#64748B" letter-spacing="3">
        +92 311 8284694 • 1-ON-1 ONLINE QURAN &amp; TAJWEED TUTORING
      </text>
    </g>
  </g>
</svg>
