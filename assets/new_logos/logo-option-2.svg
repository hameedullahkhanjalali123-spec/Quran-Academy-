<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200">
  <defs>
    <linearGradient id="goldLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="deepGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064E3B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ICON EMBLEM: Islamic Octagram Star Shield -->
  <g transform="translate(35, 20)" filter="url(#shadow2)">
    <!-- 8-Pointed Star Base -->
    <rect x="20" y="20" width="120" height="120" rx="16" fill="url(#deepGreen)" />
    <rect x="20" y="20" width="120" height="120" rx="16" fill="url(#deepGreen)" transform="rotate(45 80 80)" />

    <!-- Gold Border Ring -->
    <circle cx="80" cy="80" r="62" fill="none" stroke="url(#goldLuxe)" stroke-width="2.5" />
    <circle cx="80" cy="80" r="56" fill="#022C22" />

    <!-- Mihrab / Arch motif -->
    <path d="M 52 110 L 52 74 Q 80 44 108 74 L 108 110 Z" fill="none" stroke="url(#goldLuxe)" stroke-width="1.8" opacity="0.6"/>

    <!-- Radiant Crescent -->
    <path d="M 80 48 A 24 24 0 1 0 98 86 A 20 20 0 1 1 80 48 Z" fill="url(#goldLuxe)"/>
    <!-- Center Star -->
    <polygon points="94,56 96,62 102,64 96,66 94,72 92,66 86,64 92,62" fill="url(#goldLuxe)"/>

    <!-- Open Quran with glowing pages -->
    <path d="M 46 96 Q 63 86 80 90 L 80 118 Q 63 112 46 122 Z" fill="#FFFFFF"/>
    <path d="M 114 96 Q 97 86 80 90 L 80 118 Q 97 112 114 122 Z" fill="#FFFFFF"/>
    <path d="M 50 100 Q 64 92 76 94 L 76 114 Q 64 110 50 117 Z" fill="#F0FDF4"/>
    <path d="M 110 100 Q 96 92 84 94 L 84 114 Q 96 110 110 117 Z" fill="#F0FDF4"/>

    <!-- Quran Rehl -->
    <polygon points="76,117 84,117 88,128 72,128" fill="url(#goldLuxe)"/>
    <line x1="64" y1="128" x2="96" y2="128" stroke="url(#goldLuxe)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(225, 0)">
    <!-- Top Line: Q ISLAMIC -->
    <text x="0" y="86" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="52" font-weight="900" fill="#064E3B" letter-spacing="2">
      Q ISLAMIC
    </text>

    <!-- Second Line: ACADEMY in Rich Metallic Gold -->
    <text x="2" y="140" font-family="'Cinzel', 'Montserrat', 'Georgia', serif" font-size="44" font-weight="800" fill="url(#goldLuxe)" letter-spacing="8">
      ACADEMY
    </text>

    <!-- Subtitle Bar -->
    <line x1="2" y1="156" x2="80" y2="156" stroke="#064E3B" stroke-width="2"/>
    <text x="92" y="168" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#475569" letter-spacing="4">
      GLOBAL ONLINE QURAN INSTITUTE
    </text>
  </g>
</svg>
