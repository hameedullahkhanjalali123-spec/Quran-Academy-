<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="goldBilingual" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="navyBilingual" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F294A" />
      <stop offset="100%" stop-color="#081A32" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F294A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ICON: Royal Calligraphic Crest -->
  <g transform="translate(30, 20)" filter="url(#shadow4)">
    <circle cx="80" cy="80" r="76" fill="#0F294A"/>
    <circle cx="80" cy="80" r="70" fill="none" stroke="url(#goldBilingual)" stroke-width="2.5"/>
    <circle cx="80" cy="80" r="64" fill="#0B1E36"/>

    <!-- Decorative Islamic Stars Pattern in Background -->
    <g opacity="0.3" stroke="url(#goldBilingual)" stroke-width="1" fill="none">
      <polygon points="80,24 94,66 136,80 94,94 80,136 66,94 24,80 66,66"/>
      <polygon points="80,30 91,69 130,80 91,91 80,130 69,91 30,80 69,69" transform="rotate(45 80 80)"/>
    </g>

    <!-- Golden Crescent -->
    <path d="M 80 34 A 46 46 0 1 0 118 114 A 38 38 0 1 1 80 34 Z" fill="url(#goldBilingual)"/>

    <!-- Central Calligraphic "اقرأ" Motif / Open Quran -->
    <path d="M 52 92 Q 66 82 80 85 L 80 114 Q 66 109 52 118 Z" fill="#FFFFFF"/>
    <path d="M 108 92 Q 94 82 80 85 L 80 114 Q 94 109 108 118 Z" fill="#FFFFFF"/>
    <polygon points="76,112 84,112 88,124 72,124" fill="url(#goldBilingual)"/>
    <line x1="64" y1="124" x2="96" y2="124" stroke="url(#goldBilingual)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Top Sparkle Star -->
    <polygon points="106,44 108,48 112,50 108,52 106,56 104,52 100,50 104,48" fill="url(#goldBilingual)"/>
  </g>

  <!-- TYPOGRAPHY: English + Arabic Calligraphy -->
  <g transform="translate(225, 0)">
    <!-- Arabic Calligraphy Title (Top) -->
    <text x="0" y="58" font-family="'Traditional Arabic', 'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', serif" font-size="36" font-weight="bold" fill="#047857" letter-spacing="1">
      أَكَادِيمِيَّةُ كِيُو الإِسْلَامِيَّة
    </text>

    <!-- Main English Brand -->
    <text x="0" y="116" font-family="'Montserrat', 'Poppins', sans-serif" font-size="52" font-weight="900" fill="#0F294A" letter-spacing="1">
      Q ISLAMIC <tspan fill="url(#goldBilingual)">ACADEMY</tspan>
    </text>

    <!-- Subtitle Bar -->
    <text x="2" y="156" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" fill="#64748B" letter-spacing="4">
      ONLINE QURAN &amp; TAJWEED TUTORING
    </text>
  </g>
</svg>
