<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emerald1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A2540" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left: X=30 to X=190, Y=20 to Y=180) -->
  <g transform="translate(30, 20)" filter="url(#shadow1)">
    <!-- Outer Decorative Glow Ring -->
    <circle cx="80" cy="80" r="76" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="2"/>
    <circle cx="80" cy="80" r="70" fill="#FFFFFF" stroke="url(#emerald1)" stroke-width="2.5" stroke-dasharray="6 3"/>

    <!-- Crescent Moon (Golden) -->
    <path d="M 85 24 A 56 56 0 1 0 126 120 A 46 46 0 1 1 85 24 Z" fill="url(#gold1)"/>

    <!-- Radiant 8-Point Star -->
    <g transform="translate(112, 38) scale(0.9)">
      <polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9" fill="url(#gold1)"/>
    </g>

    <!-- Open Holy Quran upon Rehl -->
    <!-- Left Page -->
    <path d="M 44 94 Q 62 82 80 86 L 80 122 Q 62 116 44 126 Z" fill="#047857"/>
    <path d="M 48 98 Q 63 88 77 91 L 77 118 Q 63 113 48 121 Z" fill="#FFFFFF"/>
    <!-- Page Lines (Tajweed Script representation) -->
    <line x1="53" y1="103" x2="72" y2="99" stroke="url(#gold1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="53" y1="109" x2="72" y2="105" stroke="url(#gold1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="53" y1="115" x2="68" y2="112" stroke="url(#gold1)" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Page -->
    <path d="M 116 94 Q 98 82 80 86 L 80 122 Q 98 116 116 126 Z" fill="#047857"/>
    <path d="M 112 98 Q 97 88 83 91 L 83 118 Q 97 113 112 121 Z" fill="#FFFFFF"/>
    <line x1="107" y1="103" x2="88" y2="99" stroke="url(#gold1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="107" y1="109" x2="88" y2="105" stroke="url(#gold1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="107" y1="115" x2="92" y2="112" stroke="url(#gold1)" stroke-width="2" stroke-linecap="round"/>

    <!-- Rehl (Wooden Bookstand Base) -->
    <polygon points="76,120 84,120 89,136 71,136" fill="url(#gold1)"/>
    <path d="M 62 136 L 98 136 M 66 140 L 94 140" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- TYPOGRAPHY (Right: X=220) -->
  <!-- Top Line: Q ISLAMIC -->
  <text x="220" y="86" font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="900" fill="#0A2540" letter-spacing="1.5">
    Q ISLAMIC
  </text>

  <!-- Second Line: ACADEMY (Vibrant Coral Red like Al-Furqan style) -->
  <text x="222" y="142" font-family="'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="#E11D48" letter-spacing="6">
    ACADEMY
  </text>

  <!-- Tagline / Accent Bar -->
  <rect x="222" y="160" width="80" height="4" rx="2" fill="url(#gold1)"/>
  <text x="316" y="174" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#64748B" letter-spacing="4">
    ONLINE QURAN &amp; ARABIC CLASSES
  </text>
</svg>
