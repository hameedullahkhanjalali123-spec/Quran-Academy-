    <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGradLuxe)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGradLuxe)" stroke-width="1" opacity="0.8"/>

    <!-- Shamsa Filigree Petals (16 Point Sacred Geometry) -->
    <path d="M 172.0 100.0 Q 190.2 100.0 190.2 117.9 Q 183.3 134.5 166.5 127.6 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 166.5 127.6 Q 183.3 134.5 176.5 151.1 Q 163.8 163.8 150.9 150.9 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 150.9 150.9 Q 163.8 163.8 151.1 176.5 Q 134.5 183.3 127.6 166.5 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 127.6 166.5 Q 134.5 183.3 117.9 190.2 Q 100.0 190.2 100.0 172.0 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
