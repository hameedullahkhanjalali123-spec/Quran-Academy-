    <path d="M 100.0 44.0 Q 100.0 29.6 114.0 29.4 Q 126.9 35.0 121.4 48.3 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 121.4 48.3 Q 126.9 35.0 140.0 40.1 Q 149.8 50.2 139.6 60.4 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 139.6 60.4 Q 149.8 50.2 159.9 60.0 Q 165.0 73.1 151.7 78.6 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 151.7 78.6 Q 165.0 73.1 170.6 86.0 Q 170.4 100.0 156.0 100.0 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>

    <!-- Deep Emerald Central Medallion -->
    <circle cx="100" cy="100" r="68" fill="url(#emeraldOrb)" stroke="url(#goldBevel)" stroke-width="3"/>
    <circle cx="100" cy="100" r="63" fill="none" stroke="url(#goldGradLuxe)" stroke-width="1" stroke-dasharray="4 2" opacity="0.7"/>

    <!-- Sacred 8-Point Star Interlace in Background -->
    <g opacity="0.35" stroke="url(#goldGradLuxe)" stroke-width="1.2" fill="none">
      <rect x="52" y="52" width="96" height="96" rx="4" />
      <rect x="52" y="52" width="96" height="96" rx="4" transform="rotate(45 100 100)" />
    </g>

    <!-- Beveled 3D Golden Crescent Moon -->
    <!-- Shadow Side of Crescent -->
    <path d="M 104 42 A 52 52 0 1 0 148 136 A 44 44 0 1 1 104 42 Z" fill="#92400E" opacity="0.7"/>
    <!-- Lit Side of Crescent with Metallic Shimmer -->
    <path d="M 102 44 A 50 50 0 1 0 144 134 A 42 42 0 1 1 102 44 Z" fill="url(#goldBevel)"/>

    <!-- Radiant Top Star -->
    <g transform="translate(132, 58) scale(0.95)">
      <polygon points="12,0 15,8 24,12 15,16 12,24 9,16 0,12 9,8" fill="url(#goldBevel)"/>
      <circle cx="12" cy="12" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- The Holy Quran Opened upon Ornate Rehl -->
    <!-- Rehl (Hand-carved wooden stand with gold inlay) -->
    <path d="M 72 154 L 92 134 L 100 138 L 108 134 L 128 154" fill="none" stroke="url(#goldBevel)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 80 150 L 120 150" stroke="url(#goldGradLuxe)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="96,136 104,136 102,148 98,148" fill="url(#goldBevel)"/>

    <!-- Left Page of Holy Quran (Curved 3D Book Page) -->
    <path d="M 54 116 Q 77 100 99 105 L 99 135 Q 77 130 54 142 Z" fill="#042F22"/>
    <path d="M 57 119 Q 78 105 97 108 L 97 132 Q 78 128 57 138 Z" fill="#FDFBF7"/>
    <!-- Quran Script lines (Fine gold calligraphy lines) -->
    <line x1="64" y1="117" x2="90" y2="114" stroke="url(#goldGradLuxe)" stroke-width="2" stroke-linecap="round"/>
    <line x1="64" y1="122" x2="90" y2="119" stroke="url(#goldGradLuxe)" stroke-width="2" stroke-linecap="round"/>
    <line x1="64" y1="127" x2="84" y2="124" stroke="url(#goldGradLuxe)" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Page of Holy Quran -->
    <path d="M 146 116 Q 123 100 101 105 L 101 135 Q 123 130 146 142 Z" fill="#042F22"/>
    <path d="M 143 119 Q 122 105 103 108 L 103 132 Q 122 128 143 138 Z" fill="#FDFBF7"/>
    <line x1="136" y1="117" x2="110" y2="114" stroke="url(#goldGradLuxe)" stroke-width="2" stroke-linecap="round"/>
    <line x1="136" y1="122" x2="110" y2="119" stroke="url(#goldGradLuxe)" stroke-width="2" stroke-linecap="round"/>
    <line x1="136" y1="127" x2="116" y2="124" stroke="url(#goldGradLuxe)" stroke-width="2" stroke-linecap="round"/>

    <!-- Golden Spine Ribbon (فاصل المصحف) -->
    <path d="M 100 105 L 100 145" stroke="url(#goldBevel)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ==================== EXECUTIVE TYPOGRAPHY (RIGHT) ==================== -->
  <g transform="translate(245, 15)">
    <!-- Bismillah / Sub-crest Arabic Calligraphy -->
    <text x="3" y="44" font-family="'Traditional Arabic', 'Amiri', 'Scheherazade New', serif" font-size="28" font-weight="700" fill="#047857" letter-spacing="2">
      أَكَادِيمِيَّةُ كِيُو لِتَعْلِيمِ القُرْآنِ الكَرِيم
    </text>

    <!-- Main Title: Q ISLAMIC (Architectural High-End Serif / Display Sans) -->
    <g transform="translate(0, 105)">
      <!-- Majestic letter Q with integrated gold accent -->
      <text x="0" y="0" font-family="'Cinzel', 'Playfair Display', 'Trajan Pro', 'Georgia', serif" font-size="64" font-weight="900" fill="url(#royalNavy)" letter-spacing="3">
        Q ISLAMIC
      </text>
    </g>

    <!-- Second Line: ACADEMY (In Solid Luxury 24K Gold with Wide Kerning) -->
    <g transform="translate(3, 155)">
      <text x="0" y="0" font-family="'Montserrat', 'Cinzel', 'Poppins', sans-serif" font-size="44" font-weight="800" fill="url(#goldBevel)" letter-spacing="10">
        ACADEMY
      </text>
    </g>

    <!-- Divider Bar: Royal Gold Spear / Ribbon -->
    <g transform="translate(3, 172)">
      <line x1="0" y1="0" x2="120" y2="0" stroke="url(#goldBevel)" stroke-width="2.5"/>
      <polygon points="120,-3 126,0 120,3" fill="url(#goldBevel)"/>
      <circle cx="134" cy="0" r="3" fill="#047857"/>
      <text x="148" y="4" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#475569" letter-spacing="4">
        ONLINE QURAN &amp; ARABIC EDUCATION • EST. 2024
      </text>
    </g>
