    <path d="M 28.0 100.0 Q 9.8 100.0 9.8 82.1 Q 16.7 65.5 33.5 72.4 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 33.5 72.4 Q 16.7 65.5 23.5 48.9 Q 36.2 36.2 49.1 49.1 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 49.1 49.1 Q 36.2 36.2 48.9 23.5 Q 65.5 16.7 72.4 33.5 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 72.4 33.5 Q 65.5 16.7 82.1 9.8 Q 100.0 9.8 100.0 28.0 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 100.0 28.0 Q 100.0 9.8 117.9 9.8 Q 134.5 16.7 127.6 33.5 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 127.6 33.5 Q 134.5 16.7 151.1 23.5 Q 163.8 36.2 150.9 49.1 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 150.9 49.1 Q 163.8 36.2 176.5 48.9 Q 183.3 65.5 166.5 72.4 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 166.5 72.4 Q 183.3 65.5 190.2 82.1 Q 190.2 100.0 172.0 100.0 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 156.0 100.0 Q 170.4 100.0 170.6 114.0 Q 165.0 126.9 151.7 121.4 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 151.7 121.4 Q 165.0 126.9 159.9 140.0 Q 149.8 149.8 139.6 139.6 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 139.6 139.6 Q 149.8 149.8 140.0 159.9 Q 126.9 165.0 121.4 151.7 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 121.4 151.7 Q 126.9 165.0 114.0 170.6 Q 100.0 170.4 100.0 156.0 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 100.0 156.0 Q 100.0 170.4 86.0 170.6 Q 73.1 165.0 78.6 151.7 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 78.6 151.7 Q 73.1 165.0 60.0 159.9 Q 50.2 149.8 60.4 139.6 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 60.4 139.6 Q 50.2 149.8 40.1 140.0 Q 35.0 126.9 48.3 121.4 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
    <path d="M 48.3 121.4 Q 35.0 126.9 29.4 114.0 Q 29.6 100.0 44.0 100.0 Z" fill="url(#goldGradLuxe)" opacity="0.85"/>
