<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <!-- Ultra-Luxurious Metallic 24K Gold Gradient with Specular Highlights -->
    <linearGradient id="goldGradLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="20%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Beveled Gold Highlight -->
    <linearGradient id="goldBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="45%" stop-color="#FDE68A" />
      <stop offset="55%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Royal Velvet Midnight Emerald Gradient -->
    <radialGradient id="emeraldOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="60%" stop-color="#043E2E" />
      <stop offset="100%" stop-color="#012419" />
    </radialGradient>

    <!-- Royal Navy Gradient -->
    <linearGradient id="royalNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#041220" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="luxeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

