<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTajweed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f2b38"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldTajweed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadowTajweed" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgTajweed)"/>

  <!-- Soundwave / Qira'at Melodious Waves in Background -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.18" fill="none">
    <path d="M 50 180 Q 150 110 250 180 T 450 180 T 550 180"/>
    <path d="M 50 180 Q 150 250 250 180 T 450 180 T 550 180"/>
    <path d="M 80 180 Q 180 80 300 180 T 520 180"/>
  </g>

  <!-- Main Tajweed Diagram / Book Showcase -->
  <g filter="url(#shadowTajweed)" transform="translate(150, 40)">
    <!-- Central Tablet / Book Plaque -->
    <rect x="0" y="0" width="300" height="270" rx="16" fill="#082f49" stroke="url(#goldTajweed)" stroke-width="3"/>
    <rect x="10" y="10" width="280" height="250" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,3"/>

    <!-- Calligraphic Title Header -->
    <path d="M 50 25 L 250 25 L 235 55 L 65 55 Z" fill="url(#goldTajweed)"/>
    <text x="150" y="46" font-family="'Amiri', 'Noto Nastaliq Urdu', serif" font-size="20" font-weight="bold" fill="#082f49" text-anchor="middle">عِلْمُ التَّجْوِيدِ وَالقِرَاءَة</text>

    <!-- Subtitle -->
    <text x="150" y="80" font-family="'Noto Nastaliq Urdu', serif" font-size="17" font-weight="bold" fill="#fde68a" text-anchor="middle">تجوید القران مع درست مخارج</text>

    <!-- Color-Coded Tajweed Rules Cards (Ghunna, Ikhfa, Idgham, Qalqalah, Madd) -->
    <g transform="translate(24, 100)">
      <!-- Rule 1: مخارج الحروف -->
      <rect x="0" y="0" width="120" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="18" cy="21" r="8" fill="#f59e0b"/>
      <text x="18" y="25" font-family="'Amiri', serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">م</text>
      <text x="70" y="26" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">مخارج الحروف</text>

      <!-- Rule 2: قواعدِ مدات (Red) -->
      <rect x="132" y="0" width="120" height="42" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="150" cy="21" r="8" fill="#ef4444"/>
      <text x="150" y="25" font-family="'Amiri', serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">~</text>
      <text x="198" y="26" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">قواعدِ مدات</text>

      <!-- Rule 3: غنہ و اخفاء (Green) -->
      <rect x="0" y="52" width="120" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="18" cy="73" r="8" fill="#10b981"/>
      <text x="18" y="77" font-family="'Amiri', serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ن</text>
      <text x="70" y="78" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">غنہ و اخفاء</text>

      <!-- Rule 4: صفات و قلقلہ (Blue) -->
      <rect x="132" y="52" width="120" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="150" cy="73" r="8" fill="#38bdf8"/>
      <text x="150" y="77" font-family="'Amiri', serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ق</text>
      <text x="198" y="78" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">قلقلہ و صفات</text>
    </g>

    <!-- Bottom Microphone & Qira'at Icon -->
    <g transform="translate(110, 212)">
      <rect width="80" height="26" rx="13" fill="#0284c7"/>
      <text x="40" y="17" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">حفص عن عاصم</text>
    </g>
  </g>

  <!-- Side Floating Pill -->
  <g transform="translate(430, 290)">
    <rect width="140" height="34" rx="17" fill="#047857"/>
    <text x="70" y="22" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✓ درست مخارج کی ضمانت</text>
  </g>
</svg>
