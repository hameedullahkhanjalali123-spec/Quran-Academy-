<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb235" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#8c6d17" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#056a42" />
      <stop offset="100%" stop-color="#023b24" />
    </linearGradient>
  </defs>

  <!-- Islamic Emblem Icon (Left) -->
  <g transform="translate(10, 5)">
    <!-- Base Arch / Shield -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#greenGrad)" />
    <rect x="2" y="2" width="76" height="76" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Crescent & Star -->
    <path d="M 40 18 A 11 11 0 1 0 48 36 A 14 14 0 1 1 40 18 Z" fill="url(#goldGrad)" />
    <polygon points="49,24 51,28 55,28 52,31 53,35 50,33 46,35 48,31 44,28 48,28" fill="url(#goldGrad)" />

    <!-- Open Holy Quran on Rehl -->
    <!-- Left Page -->
    <path d="M 20 54 Q 30 46 39 49 L 39 67 Q 29 64 20 70 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 23 57 Q 31 51 37 53 L 37 64 Q 31 62 23 66 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1" />
    
    <!-- Right Page -->
    <path d="M 60 54 Q 50 46 41 49 L 41 67 Q 51 64 60 70 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 57 57 Q 49 51 43 53 L 43 64 Q 49 62 57 66 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1" />

    <!-- Quran Spine / Stand -->
    <polygon points="38,65 42,65 44,74 36,74" fill="url(#goldGrad)" />
    <line x1="33" y1="74" x2="47" y2="74" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Academy Typography (English) -->
  <g transform="translate(105, 12)">
    <text x="0" y="32" font-family="'Poppins', sans-serif" font-size="25" font-weight="800" fill="#062c59" letter-spacing="0.5">
      Q ISLAMIC <tspan fill="#01748F">ACADEMY</tspan>
    </text>
    <text x="0" y="52" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#c59b27" letter-spacing="2">
      ACADEMY PROFILE &amp; COURSE GUIDE
    </text>
    <text x="0" y="68" font-family="'Poppins', sans-serif" font-size="10" font-weight="500" fill="#64748b" letter-spacing="1">
      +92 311 8284694 • ONLINE ISLAMIC CLASSES
    </text>
  </g>
</svg>
