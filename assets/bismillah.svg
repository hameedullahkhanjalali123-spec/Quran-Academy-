      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Beautiful Stylized Text representation with Arabic Diacritics -->
  <text x="50%" y="58" font-family="'Amiri', 'Traditional Arabic', serif" font-size="38" font-weight="bold" fill="url(#calliGold)" text-anchor="middle" letter-spacing="1">
